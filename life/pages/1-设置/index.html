<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>闸门设置 · life</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#1b1b1f; --card:#232329; --card2:#2a2a33; --bd:#34343f; --bd2:#3d3d4a;
    --tx:#e9e9ef; --tx2:#a3a3b2; --tx3:#747482;
    --ac:#4c8dff; --ac2:#3b74d8; --acs:rgba(76,141,255,.16);
    --ok:#3ecf8e; --wn:#ffb020; --er:#ff6060;
  }
  html[data-theme="light"]{
    --bg:#f5f5f7; --card:#ffffff; --card2:#f0f0f4; --bd:#e3e3ea; --bd2:#d5d5df;
    --tx:#1c1c22; --tx2:#5b5b68; --tx3:#8d8d99; --acs:rgba(76,141,255,.13);
  }
  [hidden]{display:none !important}
  body{
    margin:0;background:var(--bg);color:var(--tx);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:22px 22px 40px}
  .head{margin-bottom:18px}
  .row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{font-size:22px;font-weight:650;margin:0;letter-spacing:.2px}
  .ver{font-size:12px;color:var(--tx3)}
  .sub{color:var(--tx2);margin:6px 0 0;font-size:13px}
  .errbar{
    margin-top:12px;padding:9px 12px;border-radius:10px;font-size:13px;
    background:rgba(255,96,96,.12);border:1px solid rgba(255,96,96,.45);color:var(--er);
  }
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0;font-weight:650}
  .gdesc{color:var(--tx2);font-size:12px;margin:5px 0 4px}
  .field{padding:12px 0;border-top:1px solid var(--bd)}
  .card .field:first-of-type{border-top:none}
  .ftop{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
  .flabel{font-size:13px;flex:1 1 260px;min-width:220px}
  .flabel.locked{color:var(--tx2)}
  .fctl{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .unit{font-size:12px;color:var(--tx3);min-width:22px}
  .field.wide .ftop{display:block}
  .field.wide .fctl{margin-top:7px}
  .fdesc{color:var(--tx2);font-size:12px;margin-top:4px;max-width:760px}
  .fmeta{color:var(--tx3);font-size:12px;margin-top:4px}
  .fmeta b{color:var(--tx2);font-weight:600}
  .badge{
    display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:11px;
    background:var(--acs);color:var(--ac);border:1px solid rgba(76,141,255,.4);
  }
  .badge.warn{background:rgba(255,176,32,.14);color:var(--wn);border-color:rgba(255,176,32,.45)}
  .badge.def{background:transparent;color:var(--tx3);border-color:var(--bd2)}
  input[type=number],input[type=text],select,textarea{
    font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd2);
    border-radius:8px;padding:5px 8px;
  }
  input[type=number]{width:104px}
  select{min-width:190px}
  textarea{width:100%;min-height:64px;resize:vertical;font-family:inherit;line-height:1.5}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
  input:disabled{opacity:.6;cursor:not-allowed}
  input.inval{border-color:var(--er)}
  .switch{position:relative;display:inline-flex;align-items:center;cursor:pointer;width:44px;height:24px;flex:0 0 auto}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .track{
    position:absolute;inset:0;background:var(--card2);border:1px solid var(--bd2);
    border-radius:999px;transition:background .12s,border-color .12s;
  }
  .switch .track::after{
    content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:var(--tx3);transition:transform .12s,background .12s;
  }
  .switch input:checked + .track{background:var(--ac);border-color:var(--ac)}
  .switch input:checked + .track::after{transform:translateX(20px);background:#fff}
  .switch input:focus-visible + .track{box-shadow:0 0 0 3px var(--acs)}
  .note{color:var(--tx2);font-size:12px;margin:0}
  .note b{color:var(--tx)}
  .stickybar{
    position:sticky;bottom:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    margin-top:6px;padding:12px 16px;background:var(--card);border:1px solid var(--bd);
    border-radius:12px;box-shadow:0 -6px 22px rgba(0,0,0,.18);
  }
  .dirtyhint{color:var(--tx2);font-size:12px;flex:1 1 auto}
  .dirtyhint.on{color:var(--wn)}
  .btn{
    font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd2);
    border-radius:10px;padding:7px 14px;cursor:pointer;
  }
  .btn:hover:not(:disabled){background:var(--bd)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.primary{background:var(--ac);border-color:var(--ac);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--ac2)}
  .btn.primary:disabled{background:var(--card2);border-color:var(--bd2);color:var(--tx2)}
  .btn.primary.dirty{box-shadow:0 0 0 3px var(--acs)}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
    background:var(--card2);border:1px solid var(--bd2);color:var(--tx);
    border-radius:10px;padding:9px 18px;font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .16s ease,transform .16s ease;box-shadow:0 8px 26px rgba(0,0,0,.35);z-index:50;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:780px){
    .wrap{padding:16px 14px 30px}
    select{min-width:150px}
    .flabel{min-width:160px}
  }
  /* 页内 tab（纯前端切显隐，控件始终在 DOM 里） */
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .tab{font:inherit;color:var(--tx2);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 16px;cursor:pointer}
  .tab:hover{background:var(--card2);color:var(--tx)}
  .tab.active{background:var(--ac);border-color:var(--ac);color:#fff}
  .tab .tdot{display:none;width:7px;height:7px;border-radius:50%;background:var(--wn);margin-left:7px;vertical-align:middle}
  .tab.dirty .tdot{display:inline-block}
  .tab.active .tdot{background:#fff}
  .tabpanel{display:none}
  .tabpanel.active{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="row">
      <h1>闸门设置</h1>
      <span id="ver" class="ver"></span>
    </div>
    <p class="sub">拟人化闸门 —— 按作息概率放行消息，被点名分档回复，防两个 bot 互刷烧 token。上面 4 个标签页分别是：基础闸门 / 回话策略 / 防刷与睡眠 / 主动开口；本页只保存这 4 个板块的字段。</p>
    <div id="errBar" class="errbar" hidden></div>
  </header>

  <div class="tabs" id="tabs" role="tablist" aria-label="设置板块"></div>

  <div id="groups"></div>

  <div class="card">
    <p class="note">
      本页<b>只保存这 4 个板块的 48 个字段</b>：在别的页面保存不会覆盖这里的设置，反之亦然；作息曲线 / 插值半径 / 周末系数在「作息活跃度」页面调整。切标签页不会丢未保存的修改。
    </p>
  </div>

  <div class="stickybar">
    <span id="dirtyHint" class="dirtyhint">没有未保存的修改</span>
    <button id="btnReload" class="btn" type="button">重新载入</button>
    <button id="btnSave" class="btn primary" type="button">保存</button>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
(function () {
  'use strict';

  var $ = function (s) { return document.querySelector(s); };
  var bridge = window.AstrBotPluginPage || null;

  var numOr = function (v, d) { var n = Number(v); return isFinite(n) ? n : d; };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var errMsg = function (e) { return (e && (e.message || e.error)) ? String(e.message || e.error) : String(e); };

  /* ==================== 字段定义（键名与 _conf_schema.json 一致） ==================== */
  // 下面的卡片就是原来 4 个页面的卡片，字段定义一字节未改；SECTIONS 决定每张卡属于哪个 tab。
  var CARDS = [
    {
      title: '基础',
      desc: '总开关与基础概率。实际放行概率 ≈ 基础概率 × 该时刻的作息权重（被 @ / 私聊走自己的档）。',
      fields: [
        { path: 'enable', type: 'bool', label: '总开关', def: true, desc: '关掉后插件完全不介入，消息全部原样放行。' },
        { path: 'verbose_log', type: 'bool', label: '每次「已读不回」打日志', def: true, desc: '排障必开：日志里会写明消息是被哪一层丢掉的。' },
        { path: 'debug_timing', type: 'bool', label: '延迟埋点（时序日志）', def: false, desc: '把每条被处理消息的时序（平台发出 → 开始处理 → 判定 → 进入发送 → 延时结束）写进 plugin_data/life/timing.jsonl，用来定位「放行之后到真正发送」之间的滞后。默认关闭，开了才会写文件。' },
        { path: 'base_probability.chime', type: 'number', label: '群聊插话基础概率', def: 0.03, min: 0, max: 1, step: 0.01, desc: '没 @ 它时的开口概率。真机实测 0.1 在活跃群里太吵。' },
        { path: 'base_probability.proactive', type: 'number', label: '主动开口基础概率（闸门档，当前备用）', def: 0.3, min: 0, max: 1, step: 0.01, desc: '没人问它、它自己想说话时用这一档。主动开口目前走下面「主动开口」组的可打扰度概率表，这里的基础概率暂不参与；保留是为了闸门语义完整。' },
        { path: 'base_probability.addressed', type: 'number', label: '被 @ / 私聊基础概率', def: 1.0, min: 0, max: 1, step: 0.01, locked: true, desc: '恒为 1.0，不参与乘法，只用于延迟计算；睡眠时段走排队补发。' },
      ]
    },
    {
      title: '连丢、范围与名单',
      desc: '防止「连发三条一条都不回」，并限定插件对哪些会话、哪些发送者生效。',
      fields: [
        { path: 'consecutive_drop_limit', type: 'number', label: '同一发送者最多连续被丢', def: 3, min: 0, max: 99, step: 1, unit: '条', desc: '防止「连发三条一条都不回」。0 = 关闭该保护。' },
        { path: 'consecutive_drop_scope', type: 'select', label: '连丢计数范围', def: 'sender', options: [['sender', '按发送者（推荐）'], ['session', '按会话（整群共用）']], desc: '按发送者：群里很多人各说一句不会误触发；按会话：容易让机器人变吵。' },
        { path: 'silence_list', type: 'textarea', label: '静默名单', def: [], rows: 3, placeholder: '一行一个 QQ 号，也可用逗号分隔', desc: '名单内发送者的消息直接已读不回，不进 LLM（不花 token）。' },
        { path: 'session_whitelist', type: 'textarea', label: '会话白名单（umo）', def: [], rows: 3, placeholder: '留空 = 对所有会话生效', desc: '只对这些 unified_msg_origin 生效，方便先在测试群里试。' },
      ]
    },
    {
      title: '被点名分档',
      desc: '被 @ 或私聊时，按当前活跃度决定「立刻回」还是「攒一波统一回」。',
      fields: [
        { path: 'addressed_max_age_seconds', type: 'number', label: '被点名消息时效上限（秒）', def: 180, min: 0, max: 86400, step: 1, unit: '秒', clamp: true, desc: '被 @ / 私聊 的消息如果轮到时已经过去超过这个秒数，就直接不回（0 = 关闭）。防止机器人被长上下文拖住后，把几十分钟前的旧消息翻出来重答。' },
        { path: 'addressed_reply.enable', type: 'bool', label: '启用分档', def: true, desc: '关掉就永远立刻回。' },
        { path: 'addressed_reply.immediate_threshold', type: 'number', label: '立刻回复的活跃度阈值', def: 0.6, min: 0, max: 1, step: 0.05, desc: '活跃度 ≥ 此值：立刻回。低于此值：攒一个窗口再统一回一次。' },
        { path: 'addressed_reply.batch_window_seconds', type: 'number', label: '攒消息窗口', def: 120, min: 0, max: 3600, step: 1, unit: '秒', desc: '低活跃度时攒多久统一回。窗口内后到的消息并进同一次回复，不额外花 token。' },
        { path: 'addressed_reply.batch_max_messages', type: 'number', label: '一次最多合并', def: 10, min: 1, max: 100, step: 1, unit: '条', desc: '超出的只保留最新的，旧的标明还有几条没看。' },
      ]
    },
    {
      title: '回复延迟',
      desc: '替代 0.5 秒秒回，让它像个活人而不是接口。',
      fields: [
        { path: 'reply_delay.enable', type: 'bool', label: '启用回复延迟', def: true },
        { path: 'reply_delay.min_seconds', type: 'number', label: '最小延迟', def: 1, min: 0, max: 600, step: 0.5, unit: '秒' },
        { path: 'reply_delay.max_seconds', type: 'number', label: '最大延迟', def: 8, min: 0, max: 600, step: 0.5, unit: '秒', desc: '原来的默认 30 太夸张，真机实测后改成 8。' },
        { path: 'reply_delay.activity_penalty', type: 'number', label: '低活跃度额外延迟系数', def: 0.35, min: 0, max: 2, step: 0.05, desc: '额外延迟 = (1 − 活跃度) × (max − min) × 本系数。0 = 延迟与活跃度无关。' },
        { path: 'reply_delay.sleep_extra_seconds', type: 'number', label: '睡眠时段额外延迟', def: 20, min: 0, max: 600, step: 1, unit: '秒' }
      ]
    },
    {
      title: '会话冷却',
      desc: '同一会话短时间内已经回过 N 次，就暂时已读不回（防刷屏兜底）。',
      fields: [
        { path: 'session_cooldown.enable', type: 'bool', label: '会话冷却', def: true, desc: '启用后，同一会话短时间内已回过 N 次就暂时已读不回（防刷屏兜底）。' },
        { path: 'session_cooldown.window_seconds', type: 'number', label: '冷却窗口', def: 60, min: 1, max: 3600, step: 1, unit: '秒' },
        { path: 'session_cooldown.max_replies', type: 'number', label: '窗口内最多回', def: 3, min: 1, max: 50, step: 1, unit: '条' },
        { path: 'session_cooldown.exempt_addressed', type: 'bool', label: '被点名时豁免冷却', def: true, desc: '不建议关：关了会在对方连问时变哑巴。' }
      ]
    },
    {
      title: '睡眠队列',
      desc: '睡眠时段（权重 0）来的消息不丢，排队到早上补发。',
      fields: [
        { path: 'sleep_queue.enable', type: 'bool', label: '启用排队补发', def: true },
        { path: 'sleep_queue.flush_at_hour', type: 'number', label: '起床补发整点', def: 8, min: 0, max: 23, step: 1, unit: '点' },
        { path: 'sleep_queue.only_addressed', type: 'bool', label: '只补发被点名的', def: true, desc: '群聊闲聊直接丢，避免早上倒垃圾。' },
        { path: 'sleep_queue.max_per_session', type: 'number', label: '每会话最多留', def: 5, min: 1, max: 50, step: 1, unit: '条', desc: '半夜连发十条不会早上全部重放，只留最新的。' }
      ]
    },
    {
      title: '循环熔断',
      desc: '两个 bot 互相回复会疯狂烧 token；检测到 ID 交替发言就静默一会儿。',
      fields: [
        { path: 'loop_breaker.enable', type: 'bool', label: '启用循环熔断', def: true },
        { path: 'loop_breaker.alternate_rounds', type: 'number', label: '判定交替轮数', def: 4, min: 2, max: 50, step: 1, unit: '轮' },
        { path: 'loop_breaker.silence_minutes', type: 'number', label: '熔断后静默', def: 30, min: 1, max: 1440, step: 1, unit: '分钟' },
        { path: 'loop_breaker.exempt_addressed', type: 'bool', label: '被点名豁免熔断', def: true, desc: '避免真人在 @ 时变哑巴。' }
      ]
    },
    {
      title: '主动开口',
      desc: '机器人自己找话题说话。默认关闭；填了白名单才会生效，且睡眠时段绝不开口（作息表说了算）。',
      fields: [
        { path: 'proactive.enable', type: 'bool', label: '启用主动开口', def: false, desc: '★默认关闭：还要在下面填白名单才会真正生效。关着的时候其它项照样可以先配好，打开即生效。' },
        { path: 'proactive.session_list', type: 'textarea', label: '主动开口白名单（umo / 群号 / QQ 号）', def: [], rows: 4, placeholder: '一行一个会话，例如 aiocqhttp:GroupMessage:123456，或直接写群号 / QQ 号', desc: '只对这些会话主动开口。支持完整 unified_msg_origin，也可以直接填群号 / QQ 号；留空 = 不开启（保守）。一行一个，也可用逗号分隔。' },
        { path: 'proactive.timeline', type: 'text', label: '可打扰度时间线', def: '0-8=blocked,8-10=low,10-12=normal,12-14=normal,14-19=low,19-23=high,23-24=low', rows: 3, placeholder: '起始-结束=档位，逗号或换行分隔；档位取 blocked / low / normal / high', desc: '格式 起始-结束=档位，逗号或换行分隔，档位取 blocked / low / normal / high。没写到的时间一律按 blocked（请勿打扰）处理。' },
        { path: 'proactive.probability.blocked', type: 'number', label: '请勿打扰档概率', def: 0, min: 0, max: 1, step: 0.05, desc: '默认 0 = 硬闸门。调大于 0 才会让 blocked 时段重新参与掷骰子。' },
        { path: 'proactive.probability.low', type: 'number', label: '低可打扰档概率', def: 0.25, min: 0, max: 1, step: 0.05 },
        { path: 'proactive.probability.normal', type: 'number', label: '正常可打扰档概率', def: 0.7, min: 0, max: 1, step: 0.05 },
        { path: 'proactive.probability.high', type: 'number', label: '高可打扰档概率', def: 1, min: 0, max: 1, step: 0.05, desc: '实际开口概率 = 档位概率 × 当前时段活跃度（作息表），所以活跃度 0 时永远不会主动。' },
        { path: 'proactive.min_idle_minutes', type: 'number', label: '至少安静这么久才可能开口', def: 30, min: 0, max: 1440, step: 1, unit: '分钟', desc: '距上次收到用户消息至少空闲这么久才考虑主动。0 = 不限制。' },
        { path: 'proactive.cooldown_minutes', type: 'number', label: '同一会话两次主动的最小间隔', def: 45, min: 0, max: 1440, step: 1, unit: '分钟' },
        { path: 'proactive.daily_budget', type: 'number', label: '每会话每天最多主动', def: 3, min: 0, max: 100, step: 1, unit: '条', desc: '0 = 一条都不发。' },
        { path: 'proactive.max_unanswered', type: 'number', label: '连续几条没回复就停手', def: 2, min: 0, max: 100, step: 1, unit: '条', desc: '连续主动未获回复达到此数就停手，收到用户消息即清零。0 = 不限制。' },
        { path: 'proactive.jitter_minutes', type: 'number', label: '开口时刻抖动半径', def: 12, min: 0, max: 180, step: 1, unit: '分钟', desc: '真人不会准点，开口时刻在这个范围内随机浮动。' },
        { path: 'proactive.check_interval_seconds', type: 'number', label: '后台检查频率', def: 60, min: 5, max: 3600, step: 1, unit: '秒', desc: '最小 5 秒，避免忙等。' },
        { path: 'proactive.llm_timeout_seconds', type: 'number', label: '单次生成超时', def: 45, min: 1, max: 600, step: 1, unit: '秒', desc: 'provider 卡住时的硬超时；超时就放弃本次，绝不阻塞后台循环。' },
        { path: 'proactive.system_prompt', type: 'text', label: '额外人设提示（可选）', def: '', rows: 3, placeholder: '留空 = 用 AstrBot 的默认人设', desc: '主动开口时额外追加的人设提示。留空 = 用 AstrBot 的默认人设。' },
        { path: 'proactive.prompt_template', type: 'text', label: '主动开口提示词模板', def: '（现在没什么事，想主动找 Ta 说句话。可以参考最近的聊天，但不要复述。）', rows: 3, desc: '生成主动内容时用的提示模板。' }
      ]
    }
  ];

  var SECTIONS = [
    { id: 'base', name: '基础闸门', cardIdx: [0, 1] },
    { id: 'reply', name: '回话策略', cardIdx: [2, 3] },
    { id: 'anti', name: '防刷与睡眠', cardIdx: [4, 5, 6] },
    { id: 'proact', name: '主动开口', cardIdx: [7] }
  ];


  /* ==================== DOM ==================== */
  var groupsEl = $('#groups');
  var tabsEl = $('#tabs');
  var errBar = $('#errBar');
  var verEl = $('#ver');
  var dirtyHint = $('#dirtyHint');
  var btnSave = $('#btnSave');
  var btnReload = $('#btnReload');
  var toastEl = $('#toast');

  var ctrls = {};       // path -> { el, f, meta }
  var server = {};      // 服务器上的配置（嵌套结构）
  var busy = false;
  var activeTab = 'base';

  /* ==================== 取值工具 ==================== */
  function getPath(obj, path) {
    var cur = obj;
    var parts = path.split('.');
    for (var i = 0; i < parts.length; i++) {
      if (cur === null || cur === undefined || typeof cur !== 'object') return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }
  function setPath(obj, path, val) {
    var parts = path.split('.');
    var cur = obj;
    for (var i = 0; i < parts.length - 1; i++) {
      var k = parts[i];
      if (cur[k] === null || typeof cur[k] !== 'object' || Array.isArray(cur[k])) cur[k] = {};
      cur = cur[k];
    }
    cur[parts[parts.length - 1]] = val;
  }
  function listToText(v) {
    if (Array.isArray(v)) return v.map(function (x) { return String(x); }).join('\n');
    if (v === null || v === undefined) return '';
    return String(v);
  }
  function textToList(v) {
    if (Array.isArray(v)) {
      return v.map(function (x) { return String(x).trim(); }).filter(function (x) { return x.length > 0; });
    }
    return String(v === null || v === undefined ? '' : v)
      .split(/[\s,，;；]+/)
      .map(function (x) { return x.trim(); })
      .filter(function (x) { return x.length > 0; });
  }
  function fmtValue(f, v) {
    if (f.type === 'bool') return v ? '开' : '关';
    if (f.type === 'select') {
      var hit = (f.options || []).filter(function (o) { return o[0] === String(v == null ? f.def : v); })[0];
      return hit ? hit[1] : String(v == null ? f.def : v);
    }
    if (f.type === 'textarea') {
      var arr = textToList(v);
      if (!arr.length) return '空';
      var shown = arr.slice(0, 6).join('、');
      return arr.length + ' 项（' + shown + (arr.length > 6 ? '…' : '') + '）';
    }
    if (f.type === 'text') {                       // 多行纯文本：整段显示，太长就截断
      var t = String(v === null || v === undefined ? '' : v).trim();
      if (!t) return '空';
      return t.length > 26 ? t.slice(0, 26) + '…' : t;
    }
    var n = Number(v);
    if (!isFinite(n)) n = f.def;
    return String(n) + (f.unit ? ' ' + f.unit : '');
  }
  function normKey(f, v) {
    if (f.type === 'bool') return v ? '1' : '0';
    if (f.type === 'number') { var n = Number(v); return isFinite(n) ? String(n) : 'null'; }
    if (f.type === 'textarea') return JSON.stringify(textToList(v));
    if (f.type === 'text') return String(v === null || v === undefined ? '' : v).trim();
    return v === null || v === undefined ? '' : String(v);
  }
  function readCtrl(f) {
    var rec = ctrls[f.path];
    if (!rec) return undefined;
    var el = rec.el;
    if (f.type === 'bool') return !!el.checked;
    if (f.type === 'number') {
      var n = parseFloat(el.value);
      if (!isFinite(n)) return null;
      if (f.clamp) {                       // 负数/越界一律钳到边界，绝不把非法值发给后端
        if (f.min !== undefined) n = Math.max(f.min, n);
        if (f.max !== undefined) n = Math.min(f.max, n);
      }
      return n;
    }
    if (f.type === 'textarea') return textToList(el.value);
    if (f.type === 'text') return String(el.value).trim();   // 多行纯文本按整段字符串提交，只去掉首尾空白
    return el.value;
  }

  // 数值字段的输入体检（只对声明了 clamp 的字段提示，避免其它字段被噪声徽标刷屏）
  function numberIssue(f) {
    if (f.type !== 'number' || !f.clamp) return '';
    var rec = ctrls[f.path];
    if (!rec) return '';
    var raw = String(rec.el.value).trim();
    if (raw === '') return '留空，保存时沿用当前生效值';
    var n = parseFloat(raw);
    if (!isFinite(n)) return '不是数字，保存时沿用当前生效值';
    if (f.min !== undefined && n < f.min) return '小于 ' + f.min + '，保存时将按 ' + f.min + ' 提交';
    if (f.max !== undefined && n > f.max) return '大于 ' + f.max + '，保存时将按 ' + f.max + ' 提交';
    return '';
  }

  /* ==================== 渲染 ==================== */
  function buildField(f, secId) {
    var wrap = document.createElement('div');
    wrap.className = 'field';
    if (f.type === 'textarea' || f.type === 'text') wrap.className += ' wide';   // 名单/长文本整行铺开，方便粘贴一堆 QQ 号、umo 或长提示词

    var top = document.createElement('div');
    top.className = 'ftop';

    var label = document.createElement('div');
    label.className = 'flabel';
    label.textContent = f.label;
    if (f.locked) label.classList.add('locked');

    var ctlWrap = document.createElement('div');
    ctlWrap.className = 'fctl';

    var el;
    if (f.type === 'bool') {
      var sw = document.createElement('label');
      sw.className = 'switch';
      el = document.createElement('input');
      el.type = 'checkbox';
      var track = document.createElement('span');
      track.className = 'track';
      sw.appendChild(el);
      sw.appendChild(track);
      ctlWrap.appendChild(sw);
    } else if (f.type === 'select') {
      el = document.createElement('select');
      (f.options || []).forEach(function (o) {
        var opt = document.createElement('option');
        opt.value = o[0];
        opt.textContent = o[1];
        el.appendChild(opt);
      });
      ctlWrap.appendChild(el);
    } else if (f.type === 'textarea' || f.type === 'text') {
      // textarea = 名单（切分成数组）；text = 多行纯文本（整段字符串，不切分）
      el = document.createElement('textarea');
      el.rows = f.rows || (f.type === 'text' ? 2 : 3);
      if (f.placeholder) el.placeholder = f.placeholder;
      ctlWrap.appendChild(el);
    } else {
      el = document.createElement('input');
      el.type = 'number';
      if (f.min !== undefined) el.min = f.min;
      if (f.max !== undefined) el.max = f.max;
      el.step = f.step !== undefined ? f.step : 1;
      ctlWrap.appendChild(el);
      if (f.unit) {
        var unit = document.createElement('span');
        unit.className = 'unit';
        unit.textContent = f.unit;
        ctlWrap.appendChild(unit);
      }
    }

    el.id = 'f_' + secId + '__' + f.path.replace(/\./g, '_');   // 带板块前缀，避免跨板块 id 串台
    if (f.locked) {
      el.disabled = true;
      el.title = '该项固定为 ' + f.def + '，不可编辑';
    }
    el.addEventListener('input', onAnyInput);
    el.addEventListener('change', onAnyInput);

    top.appendChild(label);
    top.appendChild(ctlWrap);
    wrap.appendChild(top);

    if (f.desc) {
      var d = document.createElement('div');
      d.className = 'fdesc';
      d.textContent = f.desc;
      wrap.appendChild(d);
    }
    var meta = document.createElement('div');
    meta.className = 'fmeta';
    wrap.appendChild(meta);

    ctrls[f.path] = { el: el, f: f, meta: meta };
    return wrap;
  }

  function buildCard(g, secId) {
    var card = document.createElement('section');
    card.className = 'card';
    var h = document.createElement('h2');
    h.textContent = g.title;
    var d = document.createElement('p');
    d.className = 'gdesc';
    d.textContent = g.desc;
    card.appendChild(h);
    card.appendChild(d);
    g.fields.forEach(function (f) { card.appendChild(buildField(f, secId)); });
    return card;
  }

  // 4 个板块的表单一次性全部渲染进 DOM，切 tab 只切 display —— 所以切走再切回不会丢未保存的修改，
  // 保存时也自然是「按全部板块取值」。
  function buildForm() {
    groupsEl.innerHTML = '';
    ctrls = {};
    SECTIONS.forEach(function (sec) {
      var panel = document.createElement('section');
      panel.className = 'tabpanel';
      panel.setAttribute('data-tab', sec.id);
      panel.setAttribute('role', 'tabpanel');
      sec.cardIdx.forEach(function (i) { panel.appendChild(buildCard(CARDS[i], sec.id)); });
      groupsEl.appendChild(panel);
    });
  }

  function applyValues() {
    Object.keys(ctrls).forEach(function (path) {
      var rec = ctrls[path];
      var f = rec.f;
      var el = rec.el;
      var v = getPath(server, path);
      if (f.type === 'bool') {
        el.checked = (v === undefined || v === null) ? !!f.def : !!v;
      } else if (f.type === 'select') {
        el.value = (v === undefined || v === null) ? String(f.def) : String(v);
        if (!el.value) el.value = String(f.def);
      } else if (f.type === 'textarea') {
        el.value = listToText(v);
      } else if (f.type === 'text') {
        el.value = (v === undefined || v === null) ? String(f.def) : String(v);
      } else {
        el.value = String(numOr(v, f.def));
      }
    });
    refreshMeta();
  }

  function refreshField(path) {
    var rec = ctrls[path];
    if (!rec) return;
    var f = rec.f;
    var serverVal = getPath(server, path);
    var defVal = f.def;
    var curVal = readCtrl(f);
    if (f.clamp && curVal === null) curVal = numOr(getPath(server, path), f.def);   // 留空/非法时实际会提交当前生效值

    var changed = normKey(f, serverVal) !== normKey(f, defVal);
    var unsaved = normKey(f, curVal) !== normKey(f, serverVal);
    var html = '当前生效值 <b>' + esc(fmtValue(f, serverVal)) + '</b>';
    html += ' · 默认值 <b>' + esc(fmtValue(f, defVal)) + '</b>';
    if (changed) html += '<span class="badge">已被你改过</span>';
    else html += '<span class="badge def">与默认一致</span>';
    if (unsaved) html += '<span class="badge warn">未保存的修改：' + esc(fmtValue(f, curVal)) + '</span>';
    var issue = numberIssue(f);
    if (issue) html += '<span class="badge warn">' + esc(issue) + '</span>';
    rec.meta.innerHTML = html;
    if (rec.el.tagName === 'INPUT') rec.el.classList.toggle('inval', !!issue);
  }

  function refreshMeta() {
    Object.keys(ctrls).forEach(refreshField);
    updateDirtyUI();
  }

  function isDirty() {
    return Object.keys(ctrls).some(function (path) {
      var rec = ctrls[path];
      return normKey(rec.f, readCtrl(rec.f)) !== normKey(rec.f, getPath(server, path));
    });
  }

  function updateDirtyUI() {
    var dirty = isDirty();
    btnSave.disabled = !dirty || busy;
    btnSave.classList.toggle('dirty', dirty && !busy);
    dirtyHint.textContent = dirty ? '有未保存的修改' : '没有未保存的修改';
    dirtyHint.classList.toggle('on', dirty);
    // 哪个板块有未保存的修改，就在它的 tab 上点一颗小黄点
    Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function (b) {
      var sec = SECTIONS.filter(function (s) { return s.id === b.getAttribute('data-tab'); })[0];
      b.classList.toggle('dirty', !!sec && sectionDirty(sec));
    });
  }

  function onAnyInput() {
    Object.keys(ctrls).forEach(refreshField);
    updateDirtyUI();
  }

  /* ==================== 板块 tab ==================== */
  function buildTabs() {
    tabsEl.innerHTML = '';
    SECTIONS.forEach(function (sec) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab';
      b.setAttribute('role', 'tab');
      b.setAttribute('data-tab', sec.id);
      b.textContent = sec.name;
      b.appendChild(document.createElement('span')).className = 'tdot';
      b.addEventListener('click', function () { showTab(sec.id); });
      tabsEl.appendChild(b);
    });
  }

  function showTab(id) {
    activeTab = id;
    Array.prototype.forEach.call(groupsEl.querySelectorAll('.tabpanel'), function (p) {
      p.classList.toggle('active', p.getAttribute('data-tab') === id);
    });
    Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function (b) {
      var on = b.getAttribute('data-tab') === id;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }

  function sectionKeys(sec) {
    var keys = [];
    sec.cardIdx.forEach(function (i) {
      CARDS[i].fields.forEach(function (f) { keys.push(f.path); });
    });
    return keys;
  }

  function sectionDirty(sec) {
    return sectionKeys(sec).some(function (path) {
      var rec = ctrls[path];
      if (!rec) return false;
      return normKey(rec.f, readCtrl(rec.f)) !== normKey(rec.f, getPath(server, path));
    });
  }

  /* ==================== 提交 ==================== */
  function buildPayload() {
    var out = {};
    // 本页只提交「本页字段定义表」里的键：一个都不多带，
    // 避免「打开 A 页保存，把 B 页的设置覆盖成默认值」。
    Object.keys(ctrls).forEach(function (path) {
      var f = ctrls[path].f;
      var v = readCtrl(f);
      if (f.locked) v = f.def;
      else if (f.type === 'number' && v === null) v = numOr(getPath(server, path), f.def);
      setPath(out, path, v);
    });
    return out;
  }

  function requireBridge() {
    if (!bridge || typeof bridge.apiPost !== 'function') {
      throw new Error('未检测到 AstrBot 页面桥接（window.AstrBotPluginPage），无法调用后端');
    }
  }

  async function doSave() {
    if (busy) return;
    try {
      requireBridge();
    } catch (e) {
      showError(errMsg(e));
      return;
    }
    busy = true;
    btnSave.disabled = true;
    btnSave.textContent = '保存中…';
    try {
      var payload = buildPayload();
      var res = await bridge.apiPost('page/settings', payload);
      if (res && res.ok === false) throw new Error(res.error || res.message || '后端返回 ok=false');
      server = (res && res.config) ? res.config : payload;
      rebuild();
      hideError();
      toast('已保存');
    } catch (err) {
      showError('保存失败：' + errMsg(err));
    } finally {
      busy = false;
      btnSave.textContent = '保存';
      updateDirtyUI();
    }
  }

  async function doReload() {
    if (busy) return;
    try {
      requireBridge();
    } catch (e) {
      showError(errMsg(e));
      return;
    }
    busy = true;
    btnReload.disabled = true;
    try {
      var res = await bridge.apiGet('page/config', {});
      if (res && res.ok === false) throw new Error(res.error || res.message || '后端返回 ok=false');
      server = (res && res.config) ? res.config : {};
      if (res && res.plugin_version) verEl.textContent = '插件 ' + res.plugin_version;
      rebuild();
      hideError();
      toast('已重新载入');
    } catch (err) {
      showError('重新载入失败：' + errMsg(err));
    } finally {
      busy = false;
      btnReload.disabled = false;
      updateDirtyUI();
    }
  }

  function rebuild() {
    buildTabs();
    buildForm();
    showTab(activeTab);
    applyValues();
  }

  /* ==================== 杂项 ==================== */
  function showError(msg) { errBar.hidden = false; errBar.textContent = msg; }
  function hideError() { errBar.hidden = true; errBar.textContent = ''; }

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }

  function applyTheme(c) {
    var dark = !(c && c.isDark === false);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }

  async function waitBridge(timeoutMs) {
    var t0 = Date.now();
    while (!window.AstrBotPluginPage && (Date.now() - t0) < timeoutMs) {
      await new Promise(function (r) { setTimeout(r, 100); });
    }
    return window.AstrBotPluginPage || null;
  }

  async function init() {
    applyTheme(null);
    btnSave.addEventListener('click', doSave);
    btnReload.addEventListener('click', doReload);
    rebuild();                       // 先用默认值渲染，避免白屏

    bridge = await waitBridge(2500);
    if (!bridge) {
      showError('未检测到 AstrBot 页面桥接（window.AstrBotPluginPage）——当前显示的是默认值，保存/载入不可用。');
      return;
    }
    try { if (typeof bridge.ready === 'function') await bridge.ready(); } catch (e) { /* 忽略 */ }
    try {
      if (typeof bridge.getContext === 'function') applyTheme(bridge.getContext());
      if (typeof bridge.onContext === 'function') {
        bridge.onContext(function (c) { applyTheme(c); });
      }
    } catch (e) { /* 忽略 */ }

    try {
      var res = await bridge.apiGet('page/config', {});
      if (res && res.ok === false) throw new Error(res.error || res.message || '后端返回 ok=false');
      server = (res && res.config) ? res.config : {};
      if (res && res.plugin_version) verEl.textContent = '插件 ' + res.plugin_version;
      hideError();
      rebuild();
    } catch (err) {
      showError('读取配置失败：' + errMsg(err));
    }
  }

  init();
})();
</script>
</body>
</html>
