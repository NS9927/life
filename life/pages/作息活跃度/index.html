<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作息活跃度 · life</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#1b1b1f; --card:#232329; --card2:#2a2a33; --bd:#34343f; --bd2:#3d3d4a;
    --tx:#e9e9ef; --tx2:#a3a3b2; --tx3:#747482;
    --ac:#4c8dff; --ac2:#3b74d8; --acs:rgba(76,141,255,.16);
    --ok:#3ecf8e; --wn:#ffb020; --er:#ff6060;
    --grid:#2f2f3a; --step:#9a9aff;
  }
  html[data-theme="light"]{
    --bg:#f5f5f7; --card:#ffffff; --card2:#f0f0f4; --bd:#e3e3ea; --bd2:#d5d5df;
    --tx:#1c1c22; --tx2:#5b5b68; --tx3:#8d8d99;
    --acs:rgba(76,141,255,.13); --grid:#e7e7ee; --step:#5b5bd6;
  }
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--tx);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:22px 22px 70px}
  .head{margin-bottom:16px}
  .row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{font-size:22px;font-weight:650;margin:0;letter-spacing:.2px}
  .ver{font-size:12px;color:var(--tx3)}
  .sub{color:var(--tx2);margin:6px 0 0;font-size:13px}
  .errbar{
    margin-top:12px;padding:9px 12px;border-radius:10px;font-size:13px;
    background:rgba(255,96,96,.12);border:1px solid rgba(255,96,96,.45);color:var(--er);
  }
  .status{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--card);
    border:1px solid var(--bd);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--tx2);
  }
  .chip b{color:var(--tx);font-weight:600}
  .chip.now{border-color:var(--ac);background:var(--acs);color:var(--tx)}
  .chip.sleep{border-color:var(--wn);color:var(--wn)}
  .chip.d b{color:var(--er)}
  .chip.a b{color:var(--ok)}
  .chip.q b{color:var(--wn)}
  .chip.f b{color:var(--ac)}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
  .toolbar{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end}
  .tb-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .tb-group.actions{margin-left:auto;gap:10px}
  .tb-label{color:var(--tx3);font-size:12px}
  .fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--tx2)}
  .fld input{width:90px}
  input[type=number]{
    font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd2);
    border-radius:8px;padding:5px 8px;
  }
  input[type=number]:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
  .btn{
    font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd2);
    border-radius:10px;padding:7px 14px;cursor:pointer;
  }
  .btn:hover{background:var(--bd)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.primary{background:var(--ac);border-color:var(--ac);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--ac2)}
  .btn.primary:disabled{background:var(--card2);border-color:var(--bd2);color:var(--tx2)}
  .btn.primary.dirty{box-shadow:0 0 0 3px var(--acs)}
  .presets{display:flex;flex-wrap:wrap;gap:8px}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin:16px 0 4px;font-size:12px;color:var(--tx2)}
  .lg{display:inline-flex;align-items:center;gap:7px}
  .sw{display:inline-block;width:16px;height:0;border-top-width:3px;border-top-style:solid;border-radius:2px}
  .sw.step{border-color:var(--step)}
  .sw.prev{border-color:var(--ac);opacity:.65;border-top-style:dashed}
  .sw.now{border-color:var(--wn);border-top-style:dashed;border-top-width:2px}
  .chartwrap{position:relative;margin-top:8px;width:100%}
  svg#chart{display:block;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
  .grid{stroke:var(--grid);stroke-width:1}
  .gridv{stroke:var(--grid);stroke-width:1;stroke-dasharray:2 4;opacity:.75}
  .ax{fill:var(--tx3);font-size:11px;font-family:inherit}
  .step{fill:none;stroke:var(--step);stroke-width:2;stroke-linejoin:round}
  .prev{fill:none;stroke:var(--ac);stroke-width:2.5;opacity:.62;stroke-linejoin:round}
  .nowline{stroke:var(--wn);stroke-width:1.5;stroke-dasharray:4 3;opacity:.9}
  .nowtext{fill:var(--wn);font-size:11px;text-anchor:middle;font-family:inherit}
  .hit{fill:transparent;cursor:ns-resize}
  .dot{fill:var(--card);stroke:var(--ac);stroke-width:2;cursor:ns-resize;outline:none}
  .dot:hover{fill:var(--acs)}
  .dot:focus{stroke:var(--wn);stroke-width:3}
  .dot.active{fill:var(--ac)}
  .tip{
    position:absolute;transform:translate(-50%,-100%);background:var(--card2);
    border:1px solid var(--bd2);color:var(--tx);padding:3px 9px;border-radius:8px;
    font-size:12px;white-space:nowrap;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.28);
  }
  .hint{color:var(--tx2);font-size:12px;margin:12px 0 0}
  .hint b{color:var(--tx)}
  kbd{
    font:inherit;font-size:11px;background:var(--card2);border:1px solid var(--bd2);
    border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--tx);
  }
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
    background:var(--card2);border:1px solid var(--bd2);color:var(--tx);
    border-radius:10px;padding:9px 18px;font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .16s ease,transform .16s ease;box-shadow:0 8px 26px rgba(0,0,0,.35);z-index:50;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:780px){
    .wrap{padding:16px 14px 60px}
    .tb-group.actions{margin-left:0;width:100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="row">
      <h1>作息活跃度</h1>
      <span id="ver" class="ver"></span>
    </div>
    <p class="sub">拟人化闸门 —— 按作息概率放行消息，被点名分档回复，防两个 bot 互刷烧 token。</p>
    <div id="errBar" class="errbar" hidden></div>
    <div id="status" class="status"></div>
  </header>

  <section class="card">
    <div class="toolbar">
      <div class="tb-group">
        <span class="tb-label">预设</span>
        <span id="presets" class="presets"></span>
      </div>
      <div class="tb-group">
        <label class="fld">插值半径（分钟）
          <input id="inpInterp" type="number" min="0" max="60" step="1">
        </label>
        <label class="fld">周末系数
          <input id="inpMul" type="number" min="0" max="2" step="0.05">
        </label>
        <label class="fld">周末睡眠后移（小时）
          <input id="inpShift" type="number" min="0" max="4" step="1">
        </label>
      </div>
      <div class="tb-group actions">
        <button id="btnUndo" class="btn" type="button">撤销</button>
        <button id="btnSave" class="btn primary" type="button">保存</button>
      </div>
    </div>

    <div class="legend">
      <span class="lg"><i class="sw step"></i>你设的 48 档（每半小时一档，阶梯）</span>
      <span class="lg"><i class="sw prev"></i>插值后机器人实际使用的曲线（后端计算）</span>
      <span class="lg"><i class="sw now"></i>当前时刻</span>
    </div>

    <div class="chartwrap" id="chartwrap">
      <svg id="chart" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="tip" id="tip" hidden></div>
    </div>

    <p class="hint">
      拖动圆点改权重（0–100，只能上下）。默认<b>带动右侧所有点一起平移</b>，按住 <kbd>Shift</kbd> 只改当前点。
      键盘：<kbd>↑</kbd>/<kbd>↓</kbd> ±1，<kbd>Shift</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> ±10，<kbd>PgUp</kbd>/<kbd>PgDn</kbd> ±25。
      <b>双击</b>该点置 0（睡眠），再双击恢复原值。
    </p>
  </section>
</div>
<div id="toast" class="toast"></div>

<script>
(function () {
  'use strict';

  /* ==================== 常量 ==================== */
  var N = 48;                    // 48 个半小时档
  var H = 380;                   // SVG 高度
  var PT = 20, PB = 34, PL = 56, PR = 24;
  var DEFAULT_WEIGHTS_TEXT = '0-2=80\n2-8=0\n8-10=10\n10-12=30\n12-14=40\n14-19=30\n19-23=80\n23-24=60';

  var $ = function (s) { return document.querySelector(s); };
  var bridge = window.AstrBotPluginPage || null;

  var r2 = function (n) { return Math.round(n * 100) / 100; };
  var clamp100 = function (v) { var n = Number(v); return Math.max(0, Math.min(100, Math.round(isFinite(n) ? n : 0))); };
  var numOr = function (v, d) { var n = Number(v); return isFinite(n) ? n : d; };
  var pad2 = function (n) { return (n < 10 ? '0' : '') + n; };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var errMsg = function (e) { return (e && (e.message || e.error)) ? String(e.message || e.error) : String(e); };

  /* ==================== DOM ==================== */
  var chartwrap = $('#chartwrap');
  var svg = $('#chart');
  var tip = $('#tip');
  var statusEl = $('#status');
  var verEl = $('#ver');
  var errBar = $('#errBar');
  var toastEl = $('#toast');
  var inpInterp = $('#inpInterp');
  var inpMul = $('#inpMul');
  var inpShift = $('#inpShift');
  var btnSave = $('#btnSave');
  var btnUndo = $('#btnUndo');

  /* ==================== 状态 ==================== */
  var state = {
    weights: new Array(N).fill(30),
    interpolate: 45,
    weekendMul: 1.3,
    weekendShift: 1,
    series: null,
    now: null,
    stats: null,
    version: '',
    zeroed: {},
    dragging: null,
    seq: 0
  };
  var baseline = null;
  var nowHours = null;

  function snapshot() {
    return {
      weights: state.weights.slice(),
      interpolate: state.interpolate,
      mul: state.weekendMul,
      shift: state.weekendShift
    };
  }
  function restore(s) {
    state.weights = s.weights.slice();
    state.interpolate = s.interpolate;
    state.weekendMul = s.mul;
    state.weekendShift = s.shift;
  }
  function isDirty() { return JSON.stringify(snapshot()) !== JSON.stringify(baseline); }

  /* ==================== 时段文本 <-> 48 档 ==================== */
  function parseRanges(text) {
    var spans = [];
    String(text || '').split(/\r?\n/).forEach(function (line) {
      var m = line.trim().match(/^(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)\s*=\s*(-?\d+(?:\.\d+)?)\s*$/);
      if (!m) return;
      var a = parseFloat(m[1]);
      var b = parseFloat(m[2]);
      if (b <= a) b += 24;
      spans.push({ a: a, b: b, v: clamp100(m[3]) });
    });
    return spans;
  }
  function weightsFromText(text) {
    var out = new Array(N).fill(0);
    var spans = parseRanges(text);
    for (var i = 0; i < N; i++) {
      var t = i * 0.5;
      for (var k = 0; k < spans.length; k++) {
        if (t >= spans[k].a && t < spans[k].b) { out[i] = spans[k].v; break; }
      }
    }
    return out;
  }
  function paintSpan(out, text, value) {
    var spans = parseRanges(text);
    for (var i = 0; i < N; i++) {
      var t = i * 0.5;
      for (var k = 0; k < spans.length; k++) {
        if (t >= spans[k].a && t < spans[k].b) { out[i] = value; break; }
      }
    }
    return out;
  }
  function normalizeWeights(arr) {
    var out = new Array(N).fill(0);
    if (Array.isArray(arr)) {
      for (var i = 0; i < N; i++) { if (arr[i] !== null && arr[i] !== undefined) out[i] = clamp100(arr[i]); }
    }
    return out;
  }
  function slotLabel(i) {
    var t = i * 0.5;
    return pad2(Math.floor(t)) + ':' + (t % 1 ? '30' : '00');
  }
  function hhmm(hours) {
    var t = Math.round(hours * 60);
    return pad2(Math.floor(t / 60) % 24) + ':' + pad2(t % 60);
  }

  /* ==================== 预设 ==================== */
  var PRESETS = [
    { name: '夜猫子', hint: '02:00 睡、10:00 才醒（默认表）', make: function () { return weightsFromText(DEFAULT_WEIGHTS_TEXT); } },
    { name: '早睡早起', hint: '23:00–07:00 睡眠，其余平坦 50', make: function () { return paintSpan(new Array(N).fill(50), '23-7=0', 0); } },
    { name: '全天半强度', hint: '全部 50', make: function () { return new Array(N).fill(50); } },
    { name: '全天静音', hint: '全部 0（基本不说话）', make: function () { return new Array(N).fill(0); } }
  ];

  function buildToolbar() {
    var holder = $('#presets');
    holder.innerHTML = '';
    PRESETS.forEach(function (p) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn';
      b.textContent = p.name;
      b.title = p.hint;
      b.addEventListener('click', function () {
        state.weights = p.make();
        state.zeroed = {};
        updateChart();
        markDirty();
        schedulePreview();
        toast('已套用预设：' + p.name + '（记得点保存）');
      });
      holder.appendChild(b);
    });
  }

  /* ==================== 图表 ==================== */
  var W = 960, plotW = W - PL - PR, plotH = H - PT - PB;
  var stepPath = null, prevPath = null, nowLine = null, nowText = null;
  var dotEls = [], hitEls = [];

  function xAt(t) { return PL + (t / 24) * plotW; }
  function yAt(v) { return PT + plotH * (1 - v / 100); }

  function buildChart() {
    var cw = chartwrap.clientWidth || 0;
    W = Math.max(520, Math.round(cw));
    plotW = W - PL - PR;
    plotH = H - PT - PB;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('width', String(W));
    svg.setAttribute('height', String(H));
    svg.style.height = H + 'px';

    var g = '';
    [0, 25, 50, 75, 100].forEach(function (v) {
      var y = r2(yAt(v));
      g += '<line class="grid" x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y + '"/>';
      g += '<text class="ax" x="' + (PL - 12) + '" y="' + (y + 4) + '" text-anchor="end">' + v + '</text>';
    });
    var xl = '';
    for (var hh = 0; hh < 24; hh += 3) {
      var x = r2(xAt(hh));
      g += '<line class="gridv" x1="' + x + '" y1="' + PT + '" x2="' + x + '" y2="' + (PT + plotH) + '"/>';
      xl += '<text class="ax" x="' + x + '" y="' + (PT + plotH + 22) + '" text-anchor="middle">' + pad2(hh) + ':00</text>';
    }
    var pts = '';
    for (var i = 0; i < N; i++) {
      var px = r2(xAt(i * 0.5 + 0.25));
      pts += '<g class="ptg">'
        + '<circle class="hit" data-i="' + i + '" cx="' + px + '" cy="0" r="13"/>'
        + '<circle class="dot" data-i="' + i + '" cx="' + px + '" cy="0" r="5.5" tabindex="0" role="slider"'
        + ' aria-label="' + slotLabel(i) + ' 权重" aria-valuemin="0" aria-valuemax="100"></circle>'
        + '</g>';
    }

    svg.innerHTML =
      '<g class="gGrid">' + g + '</g>'
      + '<g class="gPrev"><path class="prev" d=""/></g>'
      + '<g class="gStep"><path class="step" d=""/></g>'
      + '<g class="gNow"><line class="nowline" x1="-99" y1="' + PT + '" x2="-99" y2="' + (PT + plotH) + '"/>'
      + '<text class="nowtext" x="-99" y="' + (PT - 6) + '"></text></g>'
      + '<g class="gPts">' + pts + '</g>'
      + '<g class="gAxis">' + xl + '</g>';

    stepPath = svg.querySelector('.step');
    prevPath = svg.querySelector('.prev');
    nowLine = svg.querySelector('.nowline');
    nowText = svg.querySelector('.nowtext');
    dotEls = Array.prototype.slice.call(svg.querySelectorAll('.dot'));
    hitEls = Array.prototype.slice.call(svg.querySelectorAll('.hit'));

    dotEls.forEach(function (el) {
      el.addEventListener('keydown', onDotKey);
      el.addEventListener('dblclick', onDotDbl);
      el.addEventListener('focus', onDotFocus);
      el.addEventListener('blur', onDotBlur);
    });
    hitEls.forEach(function (el) {
      el.addEventListener('pointerdown', onHitDown);
      el.addEventListener('dblclick', onDotDbl);
    });
  }

  function stepD() {
    var w = state.weights;
    var d = 'M ' + r2(xAt(0)) + ' ' + r2(yAt(w[0]));
    for (var i = 1; i < N; i++) {
      d += ' H ' + r2(xAt(i * 0.5)) + ' V ' + r2(yAt(w[i]));
    }
    d += ' H ' + r2(xAt(24));
    return d;
  }
  function seriesD(series) {
    if (!series || !series.length) return '';
    var d = '';
    for (var j = 0; j < series.length; j++) {
      var t = (j / series.length) * 24;
      d += (j ? ' L ' : 'M ') + r2(xAt(t)) + ' ' + r2(yAt(clamp100(series[j] * 100)));
    }
    return d;
  }

  function updateChart() {
    if (!stepPath) return;
    stepPath.setAttribute('d', stepD());
    for (var i = 0; i < N; i++) {
      var cy = r2(yAt(state.weights[i]));
      dotEls[i].setAttribute('cy', cy);
      hitEls[i].setAttribute('cy', cy);
      dotEls[i].setAttribute('aria-valuenow', String(state.weights[i]));
    }
    prevPath.setAttribute('d', seriesD(state.series));
    if (nowHours !== null && isFinite(nowHours)) {
      var x = Math.min(W - PR - 2, Math.max(PL + 2, xAt(nowHours)));
      nowLine.setAttribute('x1', x);
      nowLine.setAttribute('x2', x);
      nowText.setAttribute('x', Math.min(W - PR - 22, Math.max(PL + 22, x)));
      nowText.textContent = hhmm(nowHours);
    } else {
      nowLine.setAttribute('x1', -99);
      nowLine.setAttribute('x2', -99);
      nowText.textContent = '';
    }
  }

  function markActive(i) {
    dotEls.forEach(function (el, k) { el.classList.toggle('active', k === i); });
  }
  function showTip(i, v) {
    if (!dotEls[i]) return;
    var wr = chartwrap.getBoundingClientRect();
    var sr = svg.getBoundingClientRect();
    var sx = (sr.left - wr.left) + (xAt(i * 0.5 + 0.25) / W) * sr.width;
    var sy = (sr.top - wr.top) + (yAt(v) / H) * sr.height;
    tip.hidden = false;
    tip.textContent = slotLabel(i) + ' · ' + Math.round(v);
    tip.style.left = sx + 'px';
    tip.style.top = (sy - 12) + 'px';
  }
  function hideTip() { tip.hidden = true; }

  /* ==================== 交互 ==================== */
  function valueFromEvent(e) {
    var r = svg.getBoundingClientRect();
    var y = (e.clientY - r.top) * (H / (r.height || H));
    return clamp100(100 * (1 - (y - PT) / plotH));
  }

  function onHitDown(e) {
    if (e.button !== undefined && e.button !== 0) return;
    var i = Number(e.currentTarget.getAttribute('data-i'));
    e.preventDefault();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    state.dragging = {
      i: i,
      startV: state.weights[i],
      base: state.weights.slice(),
      moved: false
    };
    if (dotEls[i] && dotEls[i].focus) dotEls[i].focus({ preventScroll: true });   // 不能滚动页面，否则拖动中坐标系会跳
    markActive(i);
    showTip(i, state.weights[i]);
  }

  function onPointerMove(e) {
    var d = state.dragging;
    if (!d) return;
    var v = valueFromEvent(e);
    if (e.shiftKey) {
      state.weights[d.i] = v;
      delete state.zeroed[d.i];
    } else {
      var delta = v - d.startV;
      for (var k = d.i; k < N; k++) {
        var nv = clamp100(d.base[k] + delta);
        if (nv !== state.weights[k]) {
          state.weights[k] = nv;
          delete state.zeroed[k];
        }
      }
    }
    d.moved = true;
    updateChart();
    showTip(d.i, state.weights[d.i]);
    markDirty();
    schedulePreview();
  }

  function onPointerUp() {
    var d = state.dragging;
    if (!d) return;
    state.dragging = null;
    markActive(-1);
    hideTip();
    if (d.moved) {
      markDirty();
      doPreview();          // 松手立即再取一次（不防抖）
    }
  }

  function onDotKey(e) {
    var i = Number(e.currentTarget.getAttribute('data-i'));
    var d = 0;
    if (e.key === 'ArrowUp') d = e.shiftKey ? 10 : 1;
    else if (e.key === 'ArrowDown') d = e.shiftKey ? -10 : -1;
    else if (e.key === 'PageUp') d = 25;
    else if (e.key === 'PageDown') d = -25;
    else return;
    e.preventDefault();
    state.weights[i] = clamp100(state.weights[i] + d);
    delete state.zeroed[i];
    updateChart();
    markDirty();
    schedulePreview();
    showTip(i, state.weights[i]);
  }

  function onDotDbl(e) {
    e.preventDefault();
    var i = Number(e.currentTarget.getAttribute('data-i'));
    if (Object.prototype.hasOwnProperty.call(state.zeroed, i)) {
      state.weights[i] = state.zeroed[i];
      delete state.zeroed[i];
    } else {
      state.zeroed[i] = state.weights[i];
      state.weights[i] = 0;
    }
    updateChart();
    markDirty();
    doPreview();
    showTip(i, state.weights[i]);
    setTimeout(hideTip, 900);
  }

  function onDotFocus(e) {
    if (state.dragging) return;
    var i = Number(e.currentTarget.getAttribute('data-i'));
    markActive(i);
    showTip(i, state.weights[i]);
  }
  function onDotBlur() {
    if (state.dragging) return;
    markActive(-1);
    hideTip();
  }

  /* ==================== 后端调用 ==================== */
  function requireBridge() {
    if (!bridge || typeof bridge.apiPost !== 'function') {
      throw new Error('未检测到 AstrBot 页面桥接（window.AstrBotPluginPage），无法调用后端');
    }
  }
  async function apiGet(path, params) {
    requireBridge();
    var res = await bridge.apiGet('page/' + path, params || {});
    if (res && res.ok === false) throw new Error(res.error || res.message || '后端返回 ok=false');
    return res || {};
  }
  async function apiPost(path, payload) {
    requireBridge();
    var res = await bridge.apiPost('page/' + path, payload || {});
    if (res && res.ok === false) throw new Error(res.error || res.message || '后端返回 ok=false');
    return res || {};
  }

  function weightsPayload() {
    return state.weights.map(function (v) { return r2(v); });
  }

  var previewTimer = null;
  function schedulePreview() {
    if (previewTimer) clearTimeout(previewTimer);
    previewTimer = setTimeout(function () {
      previewTimer = null;
      doPreview();
    }, 150);                                   // 防抖 150ms
  }

  function fallbackSeries() {
    // 离线（没有 bridge）时用阶梯近似，真实插值一律由后端算
    var out = [];
    for (var i = 0; i < N; i++) {
      out.push(state.weights[i] / 100);
      out.push(state.weights[i] / 100);
    }
    return out;
  }

  async function doPreview() {
    var seq = ++state.seq;
    if (!bridge || typeof bridge.apiPost !== 'function') {
      state.series = fallbackSeries();
      updateChart();
      return;
    }
    var payload = { weights: weightsPayload(), interpolate_minutes: state.interpolate };
    try {
      var res = await apiPost('preview', payload);
      if (seq !== state.seq) return;
      if (Array.isArray(res.series) && res.series.length) {
        state.series = res.series.map(Number);
        updateChart();
      }
    } catch (err) {
      if (seq !== state.seq) return;
      showError('预览曲线获取失败：' + errMsg(err));
    }
  }

  async function doSave() {
    if (!isDirty()) return;
    btnSave.disabled = true;
    btnSave.textContent = '保存中…';
    try {
      var res = await apiPost('curve', {
        weights: weightsPayload(),
        interpolate_minutes: state.interpolate,
        weekend_multiplier: state.weekendMul,
        weekend_sleep_shift_hours: state.weekendShift
      });
      baseline = snapshot();
      state.zeroed = {};
      if (res && res.time_weights) state.savedText = res.time_weights;
      hideError();
      toast('已保存，立即生效');
    } catch (err) {
      showError('保存失败：' + errMsg(err));
    } finally {
      btnSave.textContent = '保存';
      markDirty();
    }
  }

  function doUndo() {
    if (!baseline) return;
    restore(baseline);
    state.zeroed = {};
    syncInputs();
    updateChart();
    markDirty();
    schedulePreview();
    toast('已撤销到上次保存的状态');
  }

  /* ==================== 载入 / 渲染 ==================== */
  function numFrom(resp, key, c, def) {
    if (resp && resp[key] !== undefined && resp[key] !== null) return numOr(resp[key], def);
    if (c && c[key] !== undefined && c[key] !== null) return numOr(c[key], def);
    return def;
  }

  function loadConfig(resp) {
    var r = resp || {};
    var c = r.config || {};
    var w = null;
    if (Array.isArray(r.curve) && r.curve.length === N) w = normalizeWeights(r.curve);
    else if (c.time_weights) w = weightsFromText(c.time_weights);
    else if (r.curve_text) w = weightsFromText(r.curve_text);
    else w = weightsFromText(DEFAULT_WEIGHTS_TEXT);

    state.weights = w;
    state.interpolate = numFrom(r, 'interpolate_minutes', c, 45);
    state.weekendMul = numFrom(r, 'weekend_multiplier', c, 1.3);
    state.weekendShift = numFrom(r, 'weekend_sleep_shift_hours', c, 1);
    state.now = r.now || null;
    state.stats = r.stats || null;
    state.version = r.plugin_version || '';
    nowHours = (state.now && isFinite(Number(state.now.hours))) ? Number(state.now.hours) : null;
    baseline = snapshot();
    syncInputs();
  }

  function syncInputs() {
    inpInterp.value = String(state.interpolate);
    inpMul.value = String(state.weekendMul);
    inpShift.value = String(state.weekendShift);
  }

  function markDirty() {
    var dirty = !!(baseline && isDirty());
    btnSave.disabled = !dirty;
    btnSave.classList.toggle('dirty', dirty);
    btnUndo.disabled = !dirty;
  }

  function chip(label, val, cls) {
    var v = (val === undefined || val === null) ? '–' : String(val);
    return '<span class="chip ' + cls + '">' + esc(label) + ' <b>' + esc(v) + '</b></span>';
  }
  function renderStatus() {
    var now = state.now;
    var st = state.stats || {};
    var h = '';
    h += '<span class="chip now">' + esc(now && now.label ? now.label : '当前时刻未知') + '</span>';
    if (now && now.sleeping) h += '<span class="chip sleep">睡眠中</span>';
    h += chip('丢弃', st.drops, 'd');
    h += chip('放行', st.allows, 'a');
    h += chip('排队', st.queued, 'q');
    h += chip('补发', st.flushed, 'f');
    statusEl.innerHTML = h;
    verEl.textContent = state.version ? ('插件 ' + state.version) : '';
  }

  function showError(msg) { errBar.hidden = false; errBar.textContent = msg; }
  function hideError() { errBar.hidden = true; errBar.textContent = ''; }

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }

  /* ==================== 主题 ==================== */
  function applyTheme(c) {
    var dark = !(c && c.isDark === false);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }

  function bindStaticUI() {
    svg.addEventListener('pointermove', onPointerMove);
    svg.addEventListener('pointerup', onPointerUp);
    svg.addEventListener('pointercancel', onPointerUp);
    svg.addEventListener('pointerleave', function () { if (!state.dragging) hideTip(); });

    inpInterp.addEventListener('input', function () {
      state.interpolate = Math.max(0, Math.min(60, numOr(inpInterp.value, state.interpolate)));
      markDirty();
      schedulePreview();
    });
    inpMul.addEventListener('input', function () {
      state.weekendMul = Math.max(0, Math.min(2, numOr(inpMul.value, state.weekendMul)));
      markDirty();
    });
    inpShift.addEventListener('input', function () {
      state.weekendShift = Math.max(0, Math.min(4, numOr(inpShift.value, state.weekendShift)));
      markDirty();
    });

    btnSave.addEventListener('click', doSave);
    btnUndo.addEventListener('click', doUndo);

    if (window.ResizeObserver) {
      var raf = 0;
      new ResizeObserver(function () {
        if (state.dragging) return;
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(function () {
          raf = 0;
          buildChart();
          updateChart();
        });
      }).observe(chartwrap);
    } else {
      window.addEventListener('resize', function () {
        if (state.dragging) return;
        buildChart();
        updateChart();
      });
    }
  }

  function demoResponse() {
    return {
      ok: true,
      config: {
        time_weights: DEFAULT_WEIGHTS_TEXT,
        interpolate_minutes: 45,
        weekend_multiplier: 1.3,
        weekend_sleep_shift_hours: 1
      },
      curve: weightsFromText(DEFAULT_WEIGHTS_TEXT),
      now: { hours: 18.7, activity: 0.51, sleeping: false, label: '18:42 活跃度 0.51（工作日·离线演示）' },
      stats: { drops: 12, allows: 5, queued: 0, flushed: 0, batched: 1 },
      plugin_version: '离线预览'
    };
  }

  async function waitBridge(timeoutMs) {
    var t0 = Date.now();
    while (!window.AstrBotPluginPage && (Date.now() - t0) < timeoutMs) {
      await new Promise(function (r) { setTimeout(r, 100); });
    }
    return window.AstrBotPluginPage || null;
  }

  async function init() {
    applyTheme(null);                 // 默认暗色
    buildToolbar();
    bindStaticUI();
    loadConfig(demoResponse());       // 先画出来，避免白屏
    buildChart();
    updateChart();
    markDirty();
    renderStatus();
    state.series = fallbackSeries();  // 先给一条阶梯近似，等真实 config 回来再换成后端的插值曲线
    updateChart();

    bridge = await waitBridge(2500);
    if (!bridge) {
      showError('未检测到 AstrBot 页面桥接（window.AstrBotPluginPage）——当前为离线预览：可以拖动编辑，但预览曲线用阶梯近似，保存不可用。');
      return;
    }
    try { if (typeof bridge.ready === 'function') await bridge.ready(); } catch (e) { /* 忽略 */ }
    try {
      if (typeof bridge.getContext === 'function') applyTheme(bridge.getContext());
      if (typeof bridge.onContext === 'function') {
        bridge.onContext(function (c) { applyTheme(c); });
      }
    } catch (e) { /* 忽略 */ }

    try {
      var resp = await apiGet('config', {});
      loadConfig(resp);
      hideError();
      buildChart();
      updateChart();
      markDirty();
      renderStatus();
      doPreview();
    } catch (err) {
      showError('读取配置失败：' + errMsg(err));
    }
  }

  init();
})();
</script>
</body>
</html>
